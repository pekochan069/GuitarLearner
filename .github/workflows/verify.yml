name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify architecture, lint, unit tests, and assembly
        run: |
          chmod +x gradlew
          ./gradlew verifyModuleBoundaries lint :architecture-lint:test :domain:test :adapters:testDebugUnitTest :presentation:logic:testDebugUnitTest :app:assembleDebug --build-cache --console=plain
      - name: Prove forbidden module dependency fails
        shell: pwsh
        run: ./scripts/verify-boundary-guard.ps1
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-static
          path: |
            **/build/reports/
            **/build/test-results/

  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify localized recreation and restored presentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            status=0;
            ./gradlew :app:connectedDebugAndroidTest --build-cache --console=plain || status=$?;
            adb logcat -d -v threadtime MetronomeAudio:D AudioTrack:W '*:S' > metronome-logcat.txt;
            exit "$status"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-connected
          path: |
            **/build/reports/
            **/build/test-results/
            metronome-logcat.txt

  verify:
    needs: [static, connected]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both validation jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CONNECTED_RESULT: ${{ needs.connected.result }}
        run: |
          printf 'static=%s connected=%s\n' "$STATIC_RESULT" "$CONNECTED_RESULT"
          test "$STATIC_RESULT" = success
          test "$CONNECTED_RESULT" = success
